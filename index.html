<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIS — The Colossus Project</title>
    <link rel="stylesheet" href="styles/interface.css">
</head>
<body>
    <div id="boot-screen">
        <div class="boot-content">
            <h1>OMNIS</h1>
            <p class="subtitle">THE COLOSSUS PROJECT</p>

            <div class="boot-status">
                <span id="boot-task">Preparing initialization...</span>
                <span id="boot-percent">0%</span>
            </div>

            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>

            <div id="boot-log"></div>
        </div>
    </div>

    <div id="app" hidden>
        <header>
            <h1>OMNIS</h1>
            <span>PROTOTYPE 001</span>
        </header>
        <main id="viewport"></main>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
